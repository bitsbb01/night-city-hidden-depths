name: Validate content

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate authored content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run content tests
        run: python -m unittest discover -s tests -v
      - name: Validate authored locations
        run: python scripts/validate_content.py
      - name: Validate authored quest flows
        run: python scripts/validate_quest_flow.py
