name: Package release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Validate and package downloadable mod ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate authored location content
        run: python scripts/validate_content.py

      - name: Validate and package game files
        run: python scripts/package_release.py

      - name: Save ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightCityHiddenDepths-${{ github.ref_name }}
          path: dist/NightCityHiddenDepths-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish ZIP on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/NightCityHiddenDepths-${GITHUB_REF_NAME}.zip" \
            --title "Night City: Hidden Depths ${GITHUB_REF_NAME}" \
            --notes "Created by Bitsbb01. Extract the ZIP into your Cyberpunk 2077 installation folder and merge the included folders. Check the release notes for supported game versions and required frameworks."
